<svg xmlns="http://www.w3.org/2000/svg" width="420" height="340" viewBox="0 760 420 340" fill="none">
<style>
@keyframes floatLeft {0%,100%{transform:translate(0,0)}50%{transform:translate(6px,-12px)}}
@keyframes floatRight {0%,100%{transform:translate(0,0)}50%{transform:translate(-8px,-16px)}}
@keyframes typing {0%,70%,100%{opacity:.25}35%{opacity:.8}}
.left{animation:floatLeft 6.5s ease-in-out infinite}
.right{animation:floatRight 8s ease-in-out infinite}
.dot{animation:typing 1.8s ease-in-out infinite}
.dot.two{animation-delay:.15s}.dot.three{animation-delay:.3s}
@media(prefers-reduced-motion:reduce){.left,.right,.dot{animation:none!important}}
</style>
